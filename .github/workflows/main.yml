name: Construire et publier LE PRÉCIS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Affiche quelle version de build.py est réellement présente dans le dépôt.
      # La première ligne du log lève tout doute en cas de mise à jour partielle.
      - name: Vérifier la version du script
        run: |
          echo "--- scripts/build.py ---"
          head -n 3 scripts/build.py
          grep -n '^VERSION' scripts/build.py || echo "(aucune ligne VERSION : script antérieur à la v3)"

      - name: Construire le site
        run: |
          set -o pipefail
          python3 scripts/build.py 2>&1 | tee build.log

      # build.py distingue deux niveaux :
      #   « ⚠ Validation »        incohérences de structure -> publication interrompue
      #   « ℹ ... lien(s) non    renvois facultatifs non résolus -> sans effet,
      #     résolu(s) »           le site ignore les renvois vers un élément absent
      # Seul le premier niveau bloque.
      - name: Bloquer si la validation signale une incohérence
        run: |
          if grep -q "⚠ Validation" build.log; then
            echo "::error::Le build a signalé des incohérences de structure : publication interrompue."
            grep -A 40 "⚠ Validation" build.log
            exit 1
          fi
          if grep -q "lien(s) non résolu(s)" build.log; then
            echo "::warning::Des renvois facultatifs ne sont pas résolus. La publication se poursuit."
          fi

      - name: Vérifier que la page a bien été produite
        run: test -s public/index.html

      - name: Résumé du build
        run: |
          {
            echo '### Build LE PRÉCIS'
            echo '```'
            cat build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Préparer l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
